[project]
name = "canvas-split-assignment"
version = "0.1.0"
description = "Split rubric-graded Canvas assignments into one 'No Submission' assignment per CLO and post per-student CLO totals"
readme = "README.md"
authors = [
    { name = "Eslam Allam", email = "eslamallam73@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.scripts]
canvas-split-assignment = "canvas_split_assignment.cli:main"
canvas-clo-split = "canvas_split_assignment.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
